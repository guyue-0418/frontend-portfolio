<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="guyue 的前端网页作品集，展示注册页、Quiz Time 与 Recipe Finder">
  <title>guyue的前端网页作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portfolio">
    <section class="hero" aria-labelledby="page-title">
      <span class="hero-dot" aria-hidden="true"></span>
      <h1 id="page-title">guyue的前端网页作品集</h1>
      <p class="hero-subtitle">这是我的前端网页作品，点击跳转到具体的页面！</p>
    </section>

    <section class="projects" id="projects" aria-label="前端作品列表">
      <a
        class="project-card reveal"
        href="https://quiz-game-zeta-virid.vercel.app/"
        target="_blank"
        rel="noreferrer"
      >
        <div class="project-preview">
          <img src="images/quiz-game.png" alt="Quiz Time 答题页面预览" width="800" height="800">
        </div>
        <div class="project-meta">
          <h2>Quiz Time</h2>
          <span class="project-tag">Quiz</span>
        </div>
      </a>

      <a
        class="project-card reveal"
        href="https://web-signup-xi.vercel.app/"
        target="_blank"
        rel="noreferrer"
      >
        <div class="project-preview">
          <img src="images/signup.png" alt="Register Form 注册页面预览" width="800" height="800">
        </div>
        <div class="project-meta">
          <h2>Register Form</h2>
          <span class="project-tag">Register</span>
        </div>
      </a>

      <a
        class="project-card reveal"
        href="https://menu-search-blond.vercel.app/"
        target="_blank"
        rel="noreferrer"
      >
        <div class="project-preview">
          <img src="images/menu-search.png" alt="Recipe Finder 菜单搜索器预览" width="800" height="800">
        </div>
        <div class="project-meta">
          <h2>Recipe Finder</h2>
          <span class="project-tag">Recipe</span>
        </div>
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
